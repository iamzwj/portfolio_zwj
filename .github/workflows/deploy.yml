name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOST: ${{ secrets.DEPLOY_SSH_KNOWN_HOST }}
      RELEASE_DIR: /tmp/portfolio-zwj-release-${{ github.sha }}
      APP_DIR: /opt/portfolio-zwj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Check deployment configuration
        id: deployment_config
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_SSH_KNOWN_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip server release until credentials are configured
        if: steps.deployment_config.outputs.ready != 'true'
        run: echo 'Build passed. Add the deployment secrets to enable Tencent Cloud releases.'

      - name: Configure pinned SSH host key
        if: steps.deployment_config.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        if: steps.deployment_config.outputs.ready == 'true'
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.wrangler \
            -czf /tmp/portfolio-zwj-release.tar.gz .
          scp -i ~/.ssh/id_ed25519 /tmp/portfolio-zwj-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/portfolio-zwj-release-${{ github.sha }}.tar.gz"

      - name: Build and restart on Tencent Cloud
        if: steps.deployment_config.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -eu
          release_dir="/tmp/portfolio-zwj-release-${{ github.sha }}"
          archive="${release_dir}.tar.gz"
          sudo rm -rf "$release_dir"
          sudo install -d -m 0755 -o "$USER" -g "$(id -gn)" "$release_dir" /opt/portfolio-zwj
          sudo tar -xzf "$archive" -C "$release_dir"
          sudo chown -R "$USER:$(id -gn)" "$release_dir"
          rsync -a --delete --exclude='.git' "$release_dir/" /opt/portfolio-zwj/
          cd /opt/portfolio-zwj
          "$HOME/.local/node-v22/bin/npm" ci
          "$HOME/.local/node-v22/bin/npm" run build
          sudo systemctl restart portfolio-zwj
          sudo systemctl is-active --quiet portfolio-zwj
          rm -rf "$release_dir" "$archive"
          REMOTE
