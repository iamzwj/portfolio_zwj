name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOST: ${{ secrets.DEPLOY_SSH_KNOWN_HOST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Check deployment configuration
        id: deployment_config
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_SSH_KNOWN_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip server release until credentials are configured
        if: steps.deployment_config.outputs.ready != 'true'
        run: echo 'Build passed. Add the deployment secrets to enable Tencent Cloud releases.'

      - name: Configure pinned SSH host key
        if: steps.deployment_config.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload verified source bundle
        if: steps.deployment_config.outputs.ready == 'true'
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=dist \
            --exclude=.wrangler \
            --exclude='.env*' \
            -czf - . | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'cat > /tmp/portfolio-zwj-release.tar.gz'

      - name: Build and restart on Tencent Cloud
        if: steps.deployment_config.outputs.ready == 'true'
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -eu
          app_dir="/opt/portfolio-zwj"
          release_dir="$(mktemp -d "$HOME/portfolio-zwj.XXXXXX")"
          trap 'rm -rf "$release_dir" /tmp/portfolio-zwj-release.tar.gz' EXIT
          tar -xzf /tmp/portfolio-zwj-release.tar.gz -C "$release_dir"
          cd "$release_dir"
          "$HOME/.local/node-v22/bin/npm" ci
          "$HOME/.local/node-v22/bin/npm" run build
          sudo rm -rf "$app_dir"
          sudo mv "$release_dir" "$app_dir"
          sudo chown -R "$USER:$(id -gn)" "$app_dir"
          rm -f /tmp/portfolio-zwj-release.tar.gz
          trap - EXIT
          sudo systemctl restart portfolio-zwj
          sudo systemctl is-active --quiet portfolio-zwj
          REMOTE
